<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot: Gestione Ordini — Gabriel Parise</title>
    <link rel="icon" type="image/png" href="img/logo.jpeg" sizes="32x32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: var(--bg);
        color: var(--ink);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 30px 15px;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .lightbox-content-page {
        background-color: var(--surface);
        padding: 40px;
        border-radius: var(--radius-l);
        max-width: 1100px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow-card-hover);
        border: 1px solid var(--border);
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease;
      }

      .gallery-header h2 {
        margin-bottom: 10px;
      }

      .gallery-header p {
        color: var(--ink-muted);
        margin-bottom: 30px;
        font-size: 0.95em;
      }

      .gallery-container {
        position: relative;
        margin-bottom: 30px;
      }

      .screenshot-gallery-modal {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        gap: 20px;
        height: 520px;
        border: 1px solid var(--border);
        border-radius: var(--radius-m);
        background-color: var(--bg);
        padding: 15px;
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
      }

      /* Nasconde la scrollbar predefinita mantenendo lo scorrimento */
      .screenshot-gallery-modal::-webkit-scrollbar {
        height: 8px;
      }
      .screenshot-gallery-modal::-webkit-scrollbar-track {
        background: var(--surface-alt);
        border-radius: 4px;
      }
      .screenshot-gallery-modal::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .gallery-image-modal {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        object-fit: contain;
        scroll-snap-align: center;
        border-radius: var(--radius-s);
        background-color: var(--surface);
      }

      .nav-button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(18, 23, 43, 0.75);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        font-size: 1.3em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background-color 0.2s ease,
          transform 0.2s ease;
        z-index: 10;
      }

      .nav-button:hover {
        background-color: var(--accent);
        transform: translateY(-50%) scale(1.08);
      }

      .nav-button.prev {
        left: -20px;
      }

      .nav-button.next {
        right: -20px;
      }

      .page-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 30px;
        flex-wrap: wrap;
        gap: 15px;
      }

      @media (max-width: 768px) {
        .lightbox-content-page {
          padding: 24px 16px;
        }

        .screenshot-gallery-modal {
          height: 280px;
          padding: 8px;
        }

        .nav-button {
          width: 38px;
          height: 38px;
          font-size: 1em;
        }

        .nav-button.prev {
          left: -10px;
        }

        .nav-button.next {
          right: -10px;
        }

        .page-actions {
          justify-content: center;
          flex-direction: column-reverse;
        }
      }
    </style>
  </head>
  <body>
    <div class="lightbox-content-page">
      <div class="gallery-header">
        <h2 data-lang-key="title">Screenshot: Gestione Ordini</h2>
        <p data-lang-key="instructions">
          Scorri orizzontalmente o usa le frecce per vedere tutti i passaggi
          dell'applicazione.
        </p>
      </div>

      <div class="gallery-container">
        <div class="screenshot-gallery-modal" id="galleryPage">
          <img
            src="img/Dashboard.png"
            data-lang-alt="alt_dashboard"
            alt="Gestione Ordini - Dashboard"
            class="gallery-image-modal"
          />
          <img
            src="img/MAC.png"
            data-lang-alt="alt_orders"
            alt="Gestione Ordini - Pagina Ordini"
            class="gallery-image-modal"
          />
          <img
            src="img/Utenti.png"
            data-lang-alt="alt_export"
            alt="Gestione Ordini - Form Esportazione"
            class="gallery-image-modal"
          />
          <img
            src="img/Materiale.png"
            data-lang-alt="alt_report"
            alt="Gestione Ordini - Report Finale"
            class="gallery-image-modal"
          />
        </div>
        <button
          class="nav-button prev"
          onclick="scrollGallery('galleryPage', -1)"
          aria-label="Precedente"
        >
          &#10094;
        </button>
        <button
          class="nav-button next"
          onclick="scrollGallery('galleryPage', 1)"
          aria-label="Successivo"
        >
          &#10095;
        </button>
      </div>

      <div class="page-actions">
        <a href="index.html" class="cta-button" data-lang-key="return_button"
          >← Torna al Profilo Digitale</a
        >
        <button id="lang-switcher" class="lang-button">ENG</button>
      </div>
    </div>

    <script>
      // Sincronizzazione tema Dark/Light memorizzato
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }

      function scrollGallery(galleryId, direction) {
        const gallery = document.getElementById(galleryId);
        if (!gallery) return;
        const scrollAmount = gallery.clientWidth;
        gallery.scrollBy({
          left: scrollAmount * direction,
          behavior: "smooth",
        });
      }

      const translations = {
        it: {
          title: "Screenshot: Gestione Ordini",
          instructions:
            "Scorri orizzontalmente o usa le frecce per vedere tutti i passaggi dell'applicazione.",
          return_button: "← Torna al Profilo Digitale",
          alt_dashboard: "Gestione Ordini - Dashboard",
          alt_orders: "Gestione Ordini - Pagina Ordini",
          alt_export: "Gestione Ordini - Form Esportazione",
          alt_report: "Gestione Ordini - Report Finale",
        },
        en: {
          title: "Screenshots: Order Management",
          instructions:
            "Scroll horizontally or use the arrows to view all application steps.",
          return_button: "← Return to Digital Profile",
          alt_dashboard: "Order Management - Dashboard",
          alt_orders: "Order Management - Orders Page",
          alt_export: "Order Management - Export Form",
          alt_report: "Order Management - Final Report",
        },
      };

      document.addEventListener("DOMContentLoaded", () => {
        const langSwitcher = document.getElementById("lang-switcher");
        let currentLang = document.documentElement.lang || "it";

        function setLanguage(lang) {
          document.documentElement.lang = lang;
          langSwitcher.textContent = lang === "it" ? "ENG" : "ITA";
          document.querySelectorAll("[data-lang-key]").forEach((el) => {
            const key = el.getAttribute("data-lang-key");
            if (translations[lang][key]) el.innerHTML = translations[lang][key];
          });
          document.querySelectorAll("[data-lang-alt]").forEach((el) => {
            const key = el.getAttribute("data-lang-alt");
            if (translations[lang][key]) el.alt = translations[lang][key];
          });
        }

        langSwitcher.addEventListener("click", () => {
          currentLang = currentLang === "it" ? "en" : "it";
          setLanguage(currentLang);
        });
        setLanguage(currentLang);
      });
    </script>
  </body>
</html>
